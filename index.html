<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1a120c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="今日情绪抽签" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="description" content="点一下，抽出今天的情绪、宜忌和一句评语。一张可保存分享的复古漫画风卡片。" />
  <link rel="icon" type="image/png" href="assets/icon.png" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <title>今日情绪抽签</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <div id="rotate" aria-hidden="true">请把手机竖过来再抽签哦</div>
    <div id="stage">
      <canvas id="bg" width="720" height="1280" aria-hidden="true"></canvas>

      <section id="screen-title" class="screen">
        <div class="logo-wrap">
          <canvas id="logo-burst" width="720" height="420" aria-hidden="true"></canvas>
          <p class="issue">今日一份 · 情绪签</p>
          <h1 class="logo">今日情绪抽签</h1>
          <p class="tagline">点一下，抽出今天的宜与忌</p>
        </div>
        <button type="button" id="btn-draw" class="btn primary">抽今日签</button>
      </section>

      <section id="screen-drawing" class="screen" hidden>
        <div id="shuffle-burst">
          <p id="shuffle-kicker">摇签中</p>
          <p id="shuffle-name">……</p>
        </div>
      </section>

      <section id="screen-result" class="screen" hidden>
        <canvas id="card" width="1080" height="1480" aria-label="今日情绪卡片"></canvas>
        <div class="btn-row">
          <button type="button" id="btn-save" class="btn primary">保存图片</button>
          <button type="button" id="btn-again" class="btn ghost">再测一次</button>
        </div>
      </section>

      <footer class="footer">
        <span>作者 hukx</span>
        <span class="sep">·</span>
        <a href="https://afdian.com/a/hukxai" target="_blank" rel="noopener noreferrer">请作者喝奶茶</a>
      </footer>

      <div id="save-overlay" hidden>
        <div class="save-panel">
          <p class="save-hint">长按图片保存到相册</p>
          <img id="save-img" alt="今日情绪卡片" />
          <button type="button" id="btn-close-save" class="btn ghost">关闭</button>
        </div>
      </div>

      <div id="toast" hidden></div>
    </div>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
